<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Appointment scheduling board with conflict detection and admin panel">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="60%" cy="30%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <text x="60" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">APPOINTMENT SCHEDULER</text>

  <!-- schedule board -->
  <g transform="translate(60 92)">
    <rect width="430" height="286" rx="18" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".12"/>

    <g font-family="monospace" font-size="10" fill="#6f6f88">
      <text x="24" y="38">MON</text><text x="104" y="38">TUE</text><text x="184" y="38">WED</text>
      <text x="264" y="38">THU</text><text x="344" y="38">FRI</text>
    </g>
    <path d="M16 52h398" stroke="#ffffff" stroke-opacity=".1"/>

    <g fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08">
      <rect x="20" y="68" width="62" height="34" rx="7"/><rect x="100" y="68" width="62" height="34" rx="7"/>
      <rect x="180" y="68" width="62" height="34" rx="7"/><rect x="260" y="68" width="62" height="34" rx="7"/>
      <rect x="340" y="68" width="62" height="34" rx="7"/>
      <rect x="20" y="112" width="62" height="34" rx="7"/><rect x="100" y="112" width="62" height="34" rx="7"/>
      <rect x="180" y="112" width="62" height="34" rx="7"/><rect x="260" y="112" width="62" height="34" rx="7"/>
      <rect x="340" y="112" width="62" height="34" rx="7"/>
      <rect x="20" y="156" width="62" height="34" rx="7"/><rect x="100" y="156" width="62" height="34" rx="7"/>
      <rect x="180" y="156" width="62" height="34" rx="7"/><rect x="260" y="156" width="62" height="34" rx="7"/>
      <rect x="340" y="156" width="62" height="34" rx="7"/>
      <rect x="20" y="200" width="62" height="34" rx="7"/><rect x="100" y="200" width="62" height="34" rx="7"/>
      <rect x="180" y="200" width="62" height="34" rx="7"/><rect x="260" y="200" width="62" height="34" rx="7"/>
      <rect x="340" y="200" width="62" height="34" rx="7"/>
    </g>

    <!-- booked slots -->
    <g fill="url(#g)" opacity=".9">
      <rect x="20" y="112" width="62" height="34" rx="7"/>
      <rect x="180" y="68" width="62" height="34" rx="7"/>
      <rect x="260" y="156" width="62" height="34" rx="7"/>
      <rect x="100" y="200" width="62" height="34" rx="7"/>
      <rect x="340" y="112" width="62" height="34" rx="7"/>
    </g>

    <!-- conflict slot -->
    <rect x="180" y="156" width="62" height="34" rx="7" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M242 173h44" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="292" y="177" fill="#f43f5e" font-family="monospace" font-size="10">conflict blocked</text>

    <text x="20" y="264" fill="#6f6f88" font-family="monospace" font-size="10">5 CONSULTATIONS BOOKED</text>
  </g>

  <!-- admin panel -->
  <g transform="translate(530 92)">
    <rect width="210" height="286" rx="18" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="20" y="34" fill="#6f6f88" font-family="monospace" font-size="10" letter-spacing="1.2">ADMIN</text>

    <g transform="translate(20 50)">
      <g fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08">
        <rect y="0" width="170" height="46" rx="10"/><rect y="58" width="170" height="46" rx="10"/><rect y="116" width="170" height="46" rx="10"/>
      </g>
      <g fill="url(#g)"><circle cx="27" cy="23" r="12"/><circle cx="27" cy="81" r="12"/><circle cx="27" cy="139" r="12"/></g>
      <g fill="#ffffff" fill-opacity=".22">
        <rect x="50" y="15" width="94" height="7" rx="3.5"/><rect x="50" y="73" width="78" height="7" rx="3.5"/><rect x="50" y="131" width="88" height="7" rx="3.5"/>
      </g>
      <g fill="#ffffff" fill-opacity=".1">
        <rect x="50" y="29" width="58" height="6" rx="3"/><rect x="50" y="87" width="66" height="6" rx="3"/><rect x="50" y="145" width="48" height="6" rx="3"/>
      </g>
    </g>

    <g transform="translate(20 236)">
      <rect width="170" height="30" rx="8" fill="none" stroke="url(#g)" stroke-width="1.5"/>
      <text x="85" y="20" fill="#e6e6f2" font-family="monospace" font-size="11" text-anchor="middle">Manage doctors</text>
    </g>
  </g>

  <text x="60" y="410" fill="#6f6f88" font-family="monospace" font-size="12" letter-spacing="1.4">MONGODB · EXPRESS · REACT · NODE</text>
</svg>
