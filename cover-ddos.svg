<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="DoS and DDoS intrusion detection: network traffic flows classified by an MLP and LSTM model into benign or attack">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="48%" cy="48%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <text x="55" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">DoS / DDoS INTRUSION DETECTION</text>

  <!-- traffic flows -->
  <text x="55" y="112" fill="#8f8fa8" font-family="monospace" font-size="10" letter-spacing="1.2">TRAFFIC FLOWS</text>
  <g fill="url(#g)" fill-opacity=".8">
    <rect x="55" y="140" width="96" height="9" rx="4.5"/>
    <rect x="55" y="172" width="132" height="9" rx="4.5"/>
    <rect x="55" y="204" width="72" height="9" rx="4.5"/>
    <rect x="55" y="236" width="148" height="9" rx="4.5"/>
    <rect x="55" y="268" width="110" height="9" rx="4.5"/>
    <rect x="55" y="300" width="84" height="9" rx="4.5"/>
  </g>
  <g fill="#ffffff" fill-opacity=".12">
    <rect x="157" y="140" width="46" height="9" rx="4.5"/>
    <rect x="193" y="172" width="10" height="9" rx="4.5"/>
    <rect x="133" y="204" width="70" height="9" rx="4.5"/>
    <rect x="171" y="268" width="32" height="9" rx="4.5"/>
    <rect x="145" y="300" width="58" height="9" rx="4.5"/>
  </g>

  <!-- network edges -->
  <g stroke="#a855f7" stroke-opacity=".22" stroke-width="1.2">
    <path d="M330 145 435 125M330 145 435 180M330 145 435 235M330 205 435 125M330 205 435 180M330 205 435 290M330 265 435 180M330 265 435 235M330 265 435 290M330 325 435 235M330 325 435 290M330 325 435 125"/>
    <path d="M435 125 545 190M435 180 545 190M435 235 545 190M435 290 545 190M435 125 545 275M435 180 545 275M435 235 545 275M435 290 545 275"/>
  </g>
  <g stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.6">
    <path d="M215 205 320 205M215 240 320 210"/>
  </g>

  <!-- layers -->
  <g fill="#0b0b12" stroke="url(#g)" stroke-width="2.2">
    <circle cx="330" cy="145" r="11"/><circle cx="330" cy="205" r="11"/>
    <circle cx="330" cy="265" r="11"/><circle cx="330" cy="325" r="11"/>
    <circle cx="435" cy="125" r="11"/><circle cx="435" cy="180" r="11"/>
    <circle cx="435" cy="235" r="11"/><circle cx="435" cy="290" r="11"/>
    <circle cx="545" cy="190" r="13"/><circle cx="545" cy="275" r="13"/>
  </g>

  <text x="330" y="372" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">INPUT</text>
  <text x="435" y="372" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">MLP / LSTM</text>
  <text x="545" y="372" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">OUTPUT</text>

  <!-- verdicts -->
  <g font-family="monospace" font-size="12">
    <g transform="translate(596 174)">
      <rect width="149" height="32" rx="9" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="16" y="21" fill="#7fe8f5">BENIGN</text>
    </g>
    <g transform="translate(596 259)">
      <rect width="149" height="32" rx="9" fill="#a855f7" fill-opacity=".14" stroke="#a855f7" stroke-opacity=".55"/>
      <text x="16" y="21" fill="#d7b4fb">ATTACK</text>
    </g>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6">
    <path d="M558 190h34M558 275h34"/>
  </g>

  <!-- footer chips -->
  <g font-family="monospace" font-size="11" fill="#e6e6f2">
    <g transform="translate(55 400)">
      <rect width="150" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">CIC-IDS benchmark</text>
    </g>
    <g transform="translate(217 400)">
      <rect width="118" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">MLP + LSTM</text>
    </g>
    <g transform="translate(347 400)">
      <rect width="160" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">&gt;99% accuracy</text>
    </g>
    <g transform="translate(519 400)">
      <rect width="226" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">ISTE Journal &#183; 2026</text>
    </g>
  </g>
</svg>
