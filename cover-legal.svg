<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Legal chatbot conversation grounded in a document knowledge base">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="35%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".24"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <text x="60" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">LLM · LEGAL KNOWLEDGE BASE</text>

  <!-- conversation -->
  <g transform="translate(60 92)">
    <!-- user bubble -->
    <path d="M120 0h236a14 14 0 0 1 14 14v54a14 14 0 0 1-14 14H120a14 14 0 0 1-14-14V14A14 14 0 0 1 120 0z"
          fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <g fill="#ffffff" fill-opacity=".2">
      <rect x="128" y="24" width="212" height="8" rx="4"/><rect x="128" y="46" width="146" height="8" rx="4"/>
    </g>
    <text x="370" y="98" fill="#6f6f88" font-family="monospace" font-size="10" text-anchor="end">USER</text>

    <!-- bot bubble -->
    <path d="M14 118h300a14 14 0 0 1 14 14v82a14 14 0 0 1-14 14H14A14 14 0 0 1 0 214v-82a14 14 0 0 1 14-14z"
          fill="none" stroke="url(#g)" stroke-width="2"/>
    <g fill="#ffffff" fill-opacity=".22">
      <rect x="24" y="142" width="276" height="8" rx="4"/><rect x="24" y="164" width="240" height="8" rx="4"/>
      <rect x="24" y="186" width="262" height="8" rx="4"/>
    </g>
    <g>
      <rect x="24" y="206" width="96" height="20" rx="6" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="34" y="220" fill="#22d3ee" font-family="monospace" font-size="10">§ 138 NI Act</text>
    </g>
    <text x="0" y="256" fill="#6f6f88" font-family="monospace" font-size="10">ASSISTANT</text>
  </g>

  <!-- scales of justice -->
  <g transform="translate(600 190)" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -76v128M-46 52h92M-64 -66h128"/>
    <path d="M-64 -66l-26 46h52zM64 -66l26 46H38z"/>
    <path d="M-90 -20a26 26 0 0 0 52 0M38 -20a26 26 0 0 0 52 0"/>
    <circle cx="0" cy="-76" r="7"/>
  </g>

  <!-- retrieved documents -->
  <g transform="translate(520 344)">
    <g fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1">
      <rect x="0" y="0" width="48" height="60" rx="8"/><rect x="60" y="0" width="48" height="60" rx="8"/>
      <rect x="120" y="0" width="48" height="60" rx="8"/>
    </g>
    <g fill="#ffffff" fill-opacity=".18">
      <rect x="10" y="14" width="28" height="5" rx="2.5"/><rect x="10" y="26" width="20" height="5" rx="2.5"/>
      <rect x="70" y="14" width="28" height="5" rx="2.5"/><rect x="70" y="26" width="22" height="5" rx="2.5"/>
      <rect x="130" y="14" width="28" height="5" rx="2.5"/><rect x="130" y="26" width="18" height="5" rx="2.5"/>
    </g>
    <text x="0" y="-12" fill="#6f6f88" font-family="monospace" font-size="10" letter-spacing="1.2">CITED SOURCES</text>
  </g>

  <text x="60" y="404" fill="#6f6f88" font-family="monospace" font-size="12" letter-spacing="1.4">LLM · PYTHON · JAVASCRIPT</text>
</svg>
