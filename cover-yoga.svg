<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Pose skeleton with keypoints and joint angle detection">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".28"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <!-- detection frame -->
  <g stroke="#22d3ee" stroke-opacity=".55" stroke-width="2" fill="none">
    <path d="M150 70h-30v30M470 70h30v30M150 400h-30v-30M470 400h30v-30"/>
  </g>
  <text x="120" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">POSE · TRACKING</text>

  <!-- skeleton -->
  <g stroke="url(#g)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M310 152V244"/>
    <path d="M262 175h96"/>
    <path d="M262 175L196 175M358 175L424 175"/>
    <path d="M310 244L262 322 226 396M310 244L370 326 424 396"/>
  </g>

  <circle cx="310" cy="124" r="22" fill="none" stroke="url(#g)" stroke-width="4"/>

  <!-- keypoints -->
  <g fill="#0b0b12" stroke="#22d3ee" stroke-width="2.5">
    <circle cx="310" cy="152" r="6"/><circle cx="262" cy="175" r="6"/><circle cx="358" cy="175" r="6"/>
    <circle cx="196" cy="175" r="6"/><circle cx="424" cy="175" r="6"/><circle cx="310" cy="244" r="6"/>
    <circle cx="262" cy="322" r="6"/><circle cx="370" cy="326" r="6"/>
    <circle cx="226" cy="396" r="6"/><circle cx="424" cy="396" r="6"/>
  </g>

  <!-- joint angle read-out -->
  <path d="M348 316a34 34 0 0 1 38 4" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="392" y="308" fill="#e6e6f2" font-family="monospace" font-size="14">148°</text>

  <!-- right panel: model confidence -->
  <g transform="translate(540 128)">
    <rect x="0" y="0" width="200" height="196" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="18" y="32" fill="#8f8fa8" font-family="monospace" font-size="11" letter-spacing="1.2">CLASSIFIER</text>

    <text x="18" y="66" fill="#e6e6f2" font-family="monospace" font-size="12">CNN</text>
    <rect x="18" y="76" width="164" height="7" rx="3.5" fill="#ffffff" fill-opacity=".08"/>
    <rect x="18" y="76" width="150" height="7" rx="3.5" fill="url(#g)"/>

    <text x="18" y="112" fill="#e6e6f2" font-family="monospace" font-size="12">XGBoost</text>
    <rect x="18" y="122" width="164" height="7" rx="3.5" fill="#ffffff" fill-opacity=".08"/>
    <rect x="18" y="122" width="132" height="7" rx="3.5" fill="url(#g)"/>

    <text x="18" y="158" fill="#e6e6f2" font-family="monospace" font-size="12">SVM</text>
    <rect x="18" y="168" width="164" height="7" rx="3.5" fill="#ffffff" fill-opacity=".08"/>
    <rect x="18" y="168" width="118" height="7" rx="3.5" fill="url(#g)"/>
  </g>

  <text x="60" y="424" fill="#6f6f88" font-family="monospace" font-size="12" letter-spacing="1.4">MEDIAPIPE · OPENCV · CNN / XGBOOST / SVM</text>
</svg>
