<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="FinTwin.ai four-service distributed architecture: React frontend, Spring Boot core API, identity service, FastAPI AI service with Ollama">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="52%" cy="45%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <text x="55" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">FINTWIN.AI &#183; 4-SERVICE DISTRIBUTED SYSTEM</text>

  <!-- connectors -->
  <g fill="none" stroke="#a855f7" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)">
    <path d="M206 225H240V158H272"/>
    <path d="M206 225H240V296H272"/>
    <path d="M462 158H537"/>
    <path d="M645 196V252"/>
  </g>
  <path d="M370 262V196" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- client -->
  <g>
    <rect x="55" y="190" width="151" height="70" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#g)" stroke-width="2"/>
    <text x="130" y="220" fill="#e6e6f2" font-family="monospace" font-size="13" text-anchor="middle">React + Vite</text>
    <text x="130" y="240" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">DASHBOARD</text>
  </g>

  <!-- core api -->
  <g>
    <rect x="272" y="122" width="190" height="72" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#g)" stroke-width="2"/>
    <text x="367" y="152" fill="#e6e6f2" font-family="monospace" font-size="13" text-anchor="middle">Spring Boot &#183; Java 21</text>
    <text x="367" y="172" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">CORE API &#183; RBAC</text>
  </g>

  <!-- identity -->
  <g>
    <rect x="272" y="262" width="190" height="72" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#g)" stroke-width="2"/>
    <text x="367" y="292" fill="#e6e6f2" font-family="monospace" font-size="13" text-anchor="middle">Identity Service</text>
    <text x="367" y="312" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">JWT &#183; TOTP 2FA &#183; OAUTH</text>
  </g>

  <!-- ai service -->
  <g>
    <rect x="537" y="122" width="208" height="72" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#g)" stroke-width="2"/>
    <text x="641" y="152" fill="#e6e6f2" font-family="monospace" font-size="13" text-anchor="middle">Python &#183; FastAPI</text>
    <text x="641" y="172" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">AI SERVICE</text>
  </g>

  <!-- ollama -->
  <g>
    <rect x="537" y="252" width="208" height="82" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#g)" stroke-width="2"/>
    <text x="641" y="282" fill="#e6e6f2" font-family="monospace" font-size="13" text-anchor="middle">Ollama &#183; qwen2.5</text>
    <text x="641" y="302" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">SELF-HOSTED LLM COPILOT</text>
    <text x="641" y="320" fill="#8f8fa8" font-family="monospace" font-size="10" text-anchor="middle">TOOL-CALLING LOOP</text>
  </g>

  <!-- infra strip -->
  <g font-family="monospace" font-size="11" fill="#e6e6f2">
    <g transform="translate(55 372)">
      <rect width="168" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">PostgreSQL &#183; Flyway</text>
    </g>
    <g transform="translate(235 372)">
      <rect width="132" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">Redis cache</text>
    </g>
    <g transform="translate(379 372)">
      <rect width="196" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">Docker &#183; K8s HPA 2&#8594;10</text>
    </g>
    <g transform="translate(587 372)">
      <rect width="158" height="30" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="15" y="20">~180 tests</text>
    </g>
  </g>
</svg>
