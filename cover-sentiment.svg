<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Sentiment analysis pipeline from Spring Boot through Flask to AWS Comprehend">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="30%" cy="30%" r="65%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".24"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0b0b12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#halo)"/>

  <text x="60" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="1.5">NLP PIPELINE</text>

  <!-- pipeline nodes -->
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <g transform="translate(60 108)">
      <rect width="190" height="72" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="95" y="34" fill="#e6e6f2" font-size="13">Spring Boot</text>
      <text x="95" y="54" fill="#7d7d96" font-size="10">backend service</text>
    </g>
    <g transform="translate(305 108)">
      <rect width="190" height="72" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="95" y="34" fill="#e6e6f2" font-size="13">Flask REST API</text>
      <text x="95" y="54" fill="#7d7d96" font-size="10">boto3 client</text>
    </g>
    <g transform="translate(550 108)">
      <rect width="190" height="72" rx="14" fill="none" stroke="url(#g)" stroke-width="2"/>
      <text x="95" y="34" fill="#e6e6f2" font-size="13">AWS Comprehend</text>
      <text x="95" y="54" fill="#7d7d96" font-size="10">managed NLP</text>
    </g>
  </g>

  <g stroke="url(#g)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M258 144h39M300 144l-10-5M300 144l-10 5"/>
    <path d="M503 144h39M545 144l-10-5M545 144l-10 5"/>
  </g>

  <!-- input message -->
  <g transform="translate(60 226)">
    <path d="M0 14a14 14 0 0 1 14-14h276a14 14 0 0 1 14 14v58a14 14 0 0 1-14 14H54l-20 20v-20H14A14 14 0 0 1 0 72z"
          fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="22" y="26" width="230" height="8" rx="4" fill="#ffffff" fill-opacity=".16"/>
    <rect x="22" y="46" width="176" height="8" rx="4" fill="#ffffff" fill-opacity=".1"/>
    <text x="22" y="-10" fill="#7d7d96" font-family="monospace" font-size="10" letter-spacing="1.2">USER FEEDBACK</text>
  </g>

  <!-- scores -->
  <g transform="translate(430 214)" font-family="monospace">
    <text x="0" y="0" fill="#7d7d96" font-size="10" letter-spacing="1.2">SENTIMENT SCORES</text>

    <text x="0" y="34" fill="#e6e6f2" font-size="12">POSITIVE</text>
    <text x="310" y="34" fill="#22d3ee" font-size="12" text-anchor="end">0.86</text>
    <rect x="0" y="44" width="310" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect x="0" y="44" width="267" height="8" rx="4" fill="url(#g)"/>

    <text x="0" y="82" fill="#e6e6f2" font-size="12">NEUTRAL</text>
    <text x="310" y="82" fill="#8f8fa8" font-size="12" text-anchor="end">0.11</text>
    <rect x="0" y="92" width="310" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect x="0" y="92" width="34" height="8" rx="4" fill="#8f8fa8"/>

    <text x="0" y="130" fill="#e6e6f2" font-size="12">NEGATIVE</text>
    <text x="310" y="130" fill="#8f8fa8" font-size="12" text-anchor="end">0.03</text>
    <rect x="0" y="140" width="310" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect x="0" y="140" width="12" height="8" rx="4" fill="#8f8fa8"/>
  </g>

  <text x="60" y="424" fill="#6f6f88" font-family="monospace" font-size="12" letter-spacing="1.4">JAVA · PYTHON · AWS · REST</text>
</svg>
